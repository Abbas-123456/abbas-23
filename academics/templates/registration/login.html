{% extends "academics/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center py-md-4">
    <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="surface p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="brand-mark mb-3"><i class="bi bi-mortarboard-fill" aria-hidden="true"></i></span>
                <h1 class="page-heading h3 mb-2">Welcome back</h1>
                <p class="page-subtitle mb-0">Sign in to manage your academic records.</p>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <input type="hidden" name="next" value="{{ next }}">
                <button class="btn btn-primary w-100 mt-2" type="submit"><i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Sign in</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
